<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="KisanLabel - pesticide label reader for Indian farmers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#4d7c0f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- floating seeds -->
  <g fill="#fde68a" opacity="0.35">
    <circle cx="120" cy="260" r="8"><animate attributeName="cy" values="260;40;260" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="40" r="6"><animate attributeName="cy" values="40;260;40" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="250" r="10"><animate attributeName="cy" values="250;50;250" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="7"><animate attributeName="cy" values="60;250;60" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="255" r="9"><animate attributeName="cy" values="255;45;255" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="50" r="6"><animate attributeName="cy" values="50;250;50" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scanner line sweeping across, like scanning a label -->
  <rect y="0" width="5" height="300" fill="#fde68a" opacity="0.55">
    <animate attributeName="x" values="0;1195;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff" opacity="0">
    🌾 KisanLabel
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="29" fill="#fef3c7" opacity="0">
    Snap a pesticide label. Get dose, safety and soil tips in your language.
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="1.2s" fill="freeze"/>
  </text>
  <text x="600" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#bbf7d0" opacity="0">
    HACKTOBERFEST 26 · HACK DAY · PUNE
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
